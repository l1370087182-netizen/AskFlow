<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学习任务板 · 问渠 AskFlow</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo"><span class="dot"></span>问渠 AskFlow</div>
      <nav class="nav">
        <a href="index.html">学习卡片</a>
        <a href="chat.html">对话学习</a>
        <a href="kb.html">知识库</a>
        <a href="interview.html">模拟面试</a>
        <a href="learning.html" class="active">任务板</a>
      </nav>
    </div>
  </header>

  <!-- 三栏：左=Agent 泳道 / 中=任务板 / 右=任务日志（窄屏变三页签切换） -->
  <main class="container board-layout">
    <!-- 窄屏页签（桌面端隐藏） -->
    <nav class="board-mtabs" aria-label="区块切换">
      <button class="bmtab active" data-tab="board" type="button">任务板</button>
      <button class="bmtab" data-tab="agents" type="button">Agent</button>
      <button class="bmtab" data-tab="log" type="button">日志</button>
    </nav>

    <aside class="board-aside" id="aside-agents">
      <section class="daily-card aside-card">
        <h3 class="aside-title">🤖 Agent 动态</h3>
        <div id="agents-lanes"></div>
        <div id="agents-summary" class="row-meta" style="margin-top:10px"></div>
      </section>
    </aside>

    <div class="board-main">
      <section class="home-hero">
        <h1>学习任务板</h1>
        <p>发布一个学习目标，AI 会拆解成子题并从知识库为你编排学习材料</p>
      </section>

      <!-- 发布目标 -->
      <section class="daily-card" style="padding:20px 24px">
        <div class="ai-input-row" style="max-width:none">
          <input id="goal-input" maxlength="500" placeholder="如：掌握 FastAPI 的依赖注入 / 搞懂 Redis 持久化…">
          <button id="btn-goal" class="btn btn-primary" type="button">发布目标</button>
        </div>
        <p id="goal-msg" class="row-meta" style="margin-top:10px"></p>
      </section>

      <!-- 任务板列表 + 分页 -->
      <div id="board-state" class="state-box">正在加载…</div>
      <div id="board-list"></div>
      <div id="board-pager" class="kb-pager"></div>
    </div>

    <aside class="board-aside" id="aside-log">
      <section class="daily-card aside-card">
        <h3 class="aside-title">📜 任务日志</h3>
        <div id="worklog-body">
          <p class="row-meta">点击任务的「日志」按钮，或点左侧 Agent 泳道上忙碌的气泡，在这里查看它的完整工作日志。</p>
        </div>
      </section>
    </aside>
  </main>

  <!-- 学习材料弹窗 -->
  <div id="item-modal" class="modal-mask" style="display:none">
    <div class="modal">
      <div class="modal-head">
        <h3 id="item-title">学习材料</h3>
        <button id="item-close" class="modal-close" title="关闭">✕</button>
      </div>
      <div id="item-meta" class="modal-meta"></div>
      <div id="item-body" class="modal-body rich"></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/topbar-user.js"></script>
  <script src="js/highlight.js"></script>
  <script src="js/learning.js"></script>
</body>
</html>
