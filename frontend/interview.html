<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>模拟面试 · 问渠 AskFlow</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo"><span class="dot"></span>问渠 AskFlow</div>
      <nav class="nav">
        <a href="index.html">学习卡片</a>
        <a href="chat.html">对话学习</a>
        <a href="kb.html">知识库</a>
        <a href="interview.html" class="active">模拟面试</a>
        <a href="learning.html">任务板</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <!-- 上传面板 -->
    <section id="setup" class="daily-card">
      <div class="card-deco" aria-hidden="true">🎯</div>
      <h2 style="font-size:22px;margin-bottom:6px">模拟面试</h2>
      <p class="brief">上传 <b>JD 截图</b> 和 <b>简历截图</b>，AI 面试官会围绕岗位考点、结合你的简历逐题提问，结束给出总评和补强建议。</p>
      <div class="iv-uploads">
        <label class="iv-file">📄 JD 截图<input id="f-jd" type="file" accept="image/*"><span id="f-jd-name">未选择</span></label>
        <label class="iv-file">👤 简历截图<input id="f-resume" type="file" accept="image/*"><span id="f-resume-name">未选择</span></label>
      </div>
      <div class="actions" style="margin-top:20px">
        <button id="btn-start" class="btn btn-primary">开始面试</button>
      </div>
      <p id="setup-err" class="row-meta" style="margin-top:10px;color:var(--red)"></p>
    </section>

    <!-- 面试对话面板 -->
    <section id="iv-chat" style="display:none">
      <div class="iv-meta daily-card" style="padding:18px 24px">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          <b id="iv-title" style="font-size:17px"></b>
          <span id="iv-round" class="rounds"></span>
          <span style="flex:1"></span>
          <button id="btn-finish" class="btn btn-danger-soft" style="padding:6px 16px;font-size:13px">结束面试，生成总评</button>
        </div>
        <div id="iv-tags" class="sources" style="margin-top:10px"></div>
      </div>
      <div id="iv-msgs" class="msg-list" style="max-height:none;padding:20px 0"></div>
      <div class="input-bar" style="border:none;padding:10px 0 0">
        <div class="input-inner">
          <textarea id="iv-input" rows="1" placeholder="回答面试官的问题…"></textarea>
          <button id="iv-undo" class="btn btn-ghost" title="撤回上一轮回答，原文回到输入框">↩ 撤回</button>
          <button id="iv-send" class="btn btn-primary">发送</button>
        </div>
      </div>
    </section>

    <!-- 面试记录 -->
    <section id="records-panel" class="daily-card" style="margin-top:20px">
      <div style="display:flex;align-items:center;gap:12px">
        <b style="font-size:16px">📋 面试记录</b>
        <span id="records-count" class="row-meta"></span>
        <span style="flex:1"></span>
        <button id="btn-refresh-records" class="btn btn-ghost btn-mini">刷新</button>
      </div>
      <p class="row-meta" style="margin-top:6px">每次面试的总评、薄弱点与缺口都会存档，可基于记录生成学习计划。</p>
      <div id="records-list" style="margin-top:10px"></div>
    </section>
  </main>

  <!-- 面试记录详情弹窗 -->
  <div id="record-modal" class="modal-mask" style="display:none">
    <div class="modal">
      <div class="modal-head">
        <h3 id="record-title">面试记录详情</h3>
        <button id="record-close" class="modal-close" title="关闭">✕</button>
      </div>
      <div id="record-meta" class="modal-meta"></div>
      <div class="set-actions" style="margin:10px 0">
        <button id="btn-gen-plan" class="btn btn-primary">生成学习计划</button>
        <button id="btn-to-board" class="btn btn-ghost" title="把弱项与缺口转成任务板学习子题">📌 发布到任务板</button>
        <span id="plan-msg" class="auth-msg"></span>
      </div>
      <div id="plan-view" class="modal-body rich" style="display:none"></div>
      <div id="record-body" class="modal-body rich"></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/topbar-user.js"></script>
  <script src="js/highlight.js"></script>
  <script src="js/interview.js"></script>
</body>
</html>
